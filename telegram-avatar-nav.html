<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Telegram: avatar navigation concept</title>
<style>
:root{
  --bg:#fff; --bg2:#f1f3f5; --text:#0f1419; --sub:#7a8794; --line:#e6e9ec;
  --blue:#2aabee; --panel:#ffffff; --shadow:0 18px 50px rgba(15,20,25,.22);
  --stage:#dfe5ea;
}
:root[data-theme="dark"]{
  --bg:#17212b; --bg2:#0e1621; --text:#f5f7f9; --sub:#7f91a4; --line:#223140;
  --blue:#5eb5f7; --panel:#1f2c3a; --shadow:0 18px 50px rgba(0,0,0,.55);
  --stage:#0a0f15;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font:16px/1.35 -apple-system,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--stage);color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

.phone{position:relative;width:390px;height:780px;max-height:calc(100vh - 70px);background:var(--bg);
  border-radius:38px;overflow:hidden;box-shadow:0 0 0 10px #000,var(--shadow);display:flex;flex-direction:column}
@media (max-width:440px){
  body{display:block}
  .phone{width:100%;height:100%;max-height:none;border-radius:0;box-shadow:none}
  .demo-ui{display:none}
}

/* Header */
.top{position:relative;display:flex;align-items:center;gap:12px;padding:16px 16px 10px;background:transparent;z-index:7}
.top h1{flex:1;font-size:20px;font-weight:650;transition:opacity .2s}
.phone.open .top h1{opacity:0}
.search{margin:0 16px 8px;height:38px;border-radius:19px;background:var(--bg2);color:var(--sub);
  display:flex;align-items:center;padding:0 14px;gap:8px;font-size:15px}
.me{position:relative;width:40px;height:40px;border-radius:50%;z-index:5;
  background:linear-gradient(135deg,#ff9a5a,#e8527a);color:#fff;font-weight:650;font-size:16px;
  display:grid;place-items:center;transition:transform .35s cubic-bezier(.3,1.4,.5,1),box-shadow .3s}
.me:active{transform:scale(.92)}
.me[aria-expanded="true"]{transform:scale(1.04);box-shadow:0 0 0 3px var(--blue)}
.me .dot{position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;border-radius:50%;
  background:#4cd964;border:2px solid var(--bg)}

/* Chat list */
.list{flex:1;overflow-y:auto;padding-bottom:12px}
.chat{display:flex;gap:12px;padding:10px 16px;align-items:center}
.chat:active{background:var(--bg2)}
.av{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:650}
.chat .body{flex:1;min-width:0;border-bottom:1px solid var(--line);padding-bottom:10px}
.row{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.time{font-size:13px;color:var(--sub);flex:none}
.msg{font-size:15px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.badge{flex:none;min-width:22px;height:22px;border-radius:11px;background:var(--blue);color:#fff;
  font-size:13px;font-weight:600;display:grid;place-items:center;padding:0 6px}

/* Compose button replaces the freed-up bottom bar space */
.fab{position:absolute;right:18px;bottom:22px;width:56px;height:56px;border-radius:50%;background:var(--blue);
  display:grid;place-items:center;box-shadow:0 8px 20px rgba(42,171,238,.45);z-index:2;transition:transform .3s}
.fab:active{transform:scale(.92)}

/* Panel */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.28);opacity:0;pointer-events:none;
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  transition:opacity .35s ease;z-index:4}
.scrim.on{opacity:1;pointer-events:auto}
.panel{position:absolute;top:0;left:0;right:0;width:100%;z-index:6;
  background:var(--panel);border-radius:0 0 28px 28px;overflow:hidden;padding-top:62px;
  clip-path:circle(0 at calc(100% - 36px) 36px);pointer-events:none;touch-action:pan-x;
  transition:clip-path .5s cubic-bezier(.2,.8,.2,1),transform .25s ease,opacity .25s ease}
.panel.on{clip-path:circle(150% at calc(100% - 36px) 36px);pointer-events:auto}
.panel.drag{transition:none}
.pin{opacity:0;transform:translateY(-6px);transition:opacity .25s ease,transform .3s ease}
.panel.on .pin{opacity:1;transform:none}
.panel.on .pin:nth-child(1){transition-delay:.12s}
.panel.on .pin:nth-child(2){transition-delay:.17s}
.panel.on .pin:nth-child(3){transition-delay:.21s}
.panel.on .pin:nth-child(4){transition-delay:.25s}
.who{display:flex;gap:12px;align-items:center;padding:6px 20px 16px}
.who .av{width:48px;height:48px;background:linear-gradient(135deg,#ff9a5a,#e8527a)}
.who b{display:block;font-weight:650}
.who span{font-size:14px;color:var(--sub)}
.menu{padding:4px 0 8px;border-top:1px solid var(--line)}
.item{display:flex;align-items:center;gap:18px;width:100%;padding:16px 20px;text-align:left;font-size:17px}
.item:hover,.item:active{background:var(--bg2)}
.item svg{flex:none;color:var(--blue)}

.toast{position:absolute;left:50%;bottom:92px;transform:translate(-50%,16px);background:rgba(20,28,36,.92);color:#fff;
  padding:10px 16px;border-radius:18px;font-size:14px;opacity:0;pointer-events:none;
  transition:opacity .25s,transform .25s;z-index:8;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}

.demo-ui{display:flex;gap:10px;font-size:13px;color:var(--sub);align-items:center}
.demo-ui button{padding:7px 14px;border-radius:16px;background:var(--panel);box-shadow:0 1px 3px rgba(0,0,0,.15)}

@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01ms!important;transition-delay:0s!important}
}
</style>
</head>
<body>

<div class="phone" id="phone">
  <header class="top">
    <h1>Chats</h1>
    <button class="me" id="me" aria-label="Open menu" aria-haspopup="true" aria-expanded="false" aria-controls="panel">
      B<span class="dot"></span>
    </button>
  </header>
  <div class="search">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    Search
  </div>

  <main class="list" id="list"></main>

  <button class="fab" aria-label="New message">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
  </button>

  <div class="scrim" id="scrim"></div>

  <nav class="panel" id="panel" aria-label="Main menu" role="menu">
    <div class="who pin">
      <div class="av">B</div>
      <div><b>Bodya</b><span>@bodya</span></div>
    </div>
    <div class="menu">
      <button class="item pin" role="menuitem" data-go="Profile">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
        Profile
      </button>
      <button class="item pin" role="menuitem" data-go="Contacts">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 19c0-3.3 3-5 6.5-5s6.5 1.700 6.500 5"/><path d="M16 4.700a3.500 3.500 0 0 1 0 6.600M18.500 14.300c1.800.7 3 2.100 3 4.700"/></svg>
        Contacts
      </button>
      <button class="item pin" role="menuitem" data-go="Saved Messages">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1Z"/></svg>
        Saved Messages
      </button>
      <button class="item pin" role="menuitem" data-go="Settings">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.400 15a1.700 1.700 0 0 0 .3 1.800l.1.1a2 2 0 1 1-2.800 2.800l-.1-.1a1.700 1.700 0 0 0-1.800-.3 1.700 1.700 0 0 0-1 1.500V21a2 2 0 1 1-4 0v-.1a1.700 1.700 0 0 0-1.100-1.500 1.700 1.700 0 0 0-1.800.3l-.1.1a2 2 0 1 1-2.800-2.800l.1-.1a1.700 1.700 0 0 0 .3-1.800 1.700 1.700 0 0 0-1.500-1H3a2 2 0 1 1 0-4h.1a1.700 1.700 0 0 0 1.500-1.100 1.700 1.700 0 0 0-.3-1.800l-.1-.1a2 2 0 1 1 2.800-2.800l.1.1a1.700 1.700 0 0 0 1.800.3H9a1.700 1.700 0 0 0 1-1.500V3a2 2 0 1 1 4 0v.1a1.700 1.700 0 0 0 1 1.500 1.700 1.700 0 0 0 1.800-.3l.1-.1a2 2 0 1 1 2.800 2.800l-.1.1a1.700 1.700 0 0 0-.3 1.800V9a1.700 1.700 0 0 0 1.500 1H21a2 2 0 1 1 0 4h-.1a1.700 1.700 0 0 0-1.500 1Z"/></svg>
        Settings
      </button>
    </div>
  </nav>

  <div class="toast" id="toast" role="status"></div>
</div>

<div class="demo-ui">
  <span>Tap the avatar · swipe the panel up to close · Esc</span>
  <button id="theme" type="button">Light / dark</button>
</div>

<script>
(function(){
  var chats=[
    ["Anna Petrova","See you at 7?","12:41","2","#e8527a"],
    ["Design Team","Maks: new icons are in Figma","12:18","14","#7c5cff"],
    ["Telegram Tips","Pin up to 5 chats in each folder","11:02","","#2aabee"],
    ["Dad","Call me when you can","10:37","1","#f39c34"],
    ["Mila","Photo","Yesterday","","#26a69a"],
    ["Work chat","Review is moved to Thursday","Yesterday","5","#5c6bc0"],
    ["Saved Messages","Voice message (0:23)","Mon","","#2aabee"],
    ["Kirill","Thanks!","Mon","","#ef6c4d"],
    ["Book club","Next one: 21 Nov","Sun","","#8d6e63"],
    ["Sasha","ok","Sun","","#43a047"]
  ];
  var list=document.getElementById("list");
  chats.forEach(function(c){
    var el=document.createElement("div");
    el.className="chat";
    var initial=c[0].charAt(0);
    el.innerHTML='<div class="av" style="background:'+c[4]+'">'+initial+'</div>'+
      '<div class="body"><div class="row"><span class="name"></span><span class="time">'+c[2]+'</span></div>'+
      '<div class="row"><span class="msg"></span>'+(c[3]?'<span class="badge">'+c[3]+'</span>':'')+'</div></div>';
    el.querySelector(".name").textContent=c[0];
    el.querySelector(".msg").textContent=c[1];
    list.appendChild(el);
  });

  var phone=document.getElementById("phone"),
      me=document.getElementById("me"),
      panel=document.getElementById("panel"),
      scrim=document.getElementById("scrim"),
      toast=document.getElementById("toast"),
      toastTimer;

  function isOpen(){return panel.classList.contains("on")}
  function open(){
    panel.classList.add("on");scrim.classList.add("on");phone.classList.add("open");
    me.setAttribute("aria-expanded","true");
    var first=panel.querySelector(".item");
    setTimeout(function(){first&&first.focus({preventScroll:true})},300);
  }
  function close(){
    panel.classList.remove("on");scrim.classList.remove("on");phone.classList.remove("open");
    panel.style.transform="";panel.style.opacity="";
    me.setAttribute("aria-expanded","false");
  }
  function say(t){
    toast.textContent=t;toast.classList.add("on");
    clearTimeout(toastTimer);
    toastTimer=setTimeout(function(){toast.classList.remove("on")},1600);
  }

  me.addEventListener("click",function(){isOpen()?close():open()});
  scrim.addEventListener("click",close);
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"&&isOpen()){close();me.focus()}
  });
  panel.addEventListener("click",function(e){
    var b=e.target.closest(".item");
    if(!b)return;
    close();
    say(b.getAttribute("data-go")+" opened");
  });

  // Swipe up on the panel to dismiss
  var sy=0,dy=0,down=false,moving=false;
  panel.addEventListener("pointerdown",function(e){
    if(!isOpen())return;
    down=true;moving=false;sy=e.clientY;dy=0;
  });
  panel.addEventListener("pointermove",function(e){
    if(!down)return;
    dy=Math.min(0,e.clientY-sy);
    if(!moving){
      if(-dy<6)return;
      moving=true;panel.classList.add("drag");panel.setPointerCapture(e.pointerId);
    }
    var p=Math.min(1,-dy/160);
    panel.style.transform="translateY("+dy+"px)";
    panel.style.opacity=1-p*.5;
    scrim.style.opacity=1-p;
  });
  function end(){
    if(!down)return;
    var was=moving;
    down=false;moving=false;
    panel.classList.remove("drag");
    scrim.style.opacity="";
    if(was&&-dy>70){close()}else{panel.style.transform="";panel.style.opacity=""}
  }
  panel.addEventListener("pointerup",end);
  panel.addEventListener("pointercancel",end);

  // Demo helper: theme switch
  var root=document.documentElement;
  if(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)root.setAttribute("data-theme","dark");
  document.getElementById("theme").addEventListener("click",function(){
    root.setAttribute("data-theme",root.getAttribute("data-theme")==="dark"?"light":"dark");
  });
})();
</script>
</body>
</html>
